<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce Command Canvas</title>
  <!-- Tailwind Play CDN (Zero npm dependencies) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Vector Icons (Zero emojis in UI) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/canvas.css">
</head>
<body class="bg-[#0c0d11] text-zinc-100 font-sans antialiased select-none overflow-hidden">

  <!-- Top Navigation & Radar Toolbar -->
  <header class="fixed top-0 left-0 right-0 h-14 bg-[#12141a]/90 backdrop-blur-md border-b border-white/10 z-50 px-5 flex items-center justify-between">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
        <i data-lucide="network" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white leading-none">Workforce Command Canvas</h1>
        <div class="flex items-center gap-2 mt-1 text-[11px] text-zinc-400 font-mono">
          <span id="stat-total-tasks">0 Tasks</span>
          <span class="text-zinc-600">•</span>
          <span id="stat-in-progress" class="text-sky-400">0 In Progress</span>
          <span class="text-zinc-600">•</span>
          <span id="stat-blocked" class="text-rose-400">0 Blocked</span>
        </div>
      </div>
    </div>

    <!-- Mode Selector Pills -->
    <div class="flex items-center bg-zinc-900/80 p-1 rounded-xl border border-white/10">
      <button id="btn-mode-workstate" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-zinc-800 text-white transition-all flex items-center gap-1.5">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
        Workstate Radar
      </button>
      <button id="btn-mode-blast" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center gap-1.5">
        <i data-lucide="git-fork" class="w-3.5 h-3.5"></i>
        Code Blast Radius
      </button>
    </div>

    <!-- Search & Filters -->
    <div class="flex items-center gap-3">
      <div class="relative w-64">
        <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="global-search" type="text" placeholder="Search tasks or symbols..." class="w-full bg-zinc-900/90 border border-white/10 rounded-lg pl-9 pr-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors">
      </div>
    </div>
  </header>

  <!-- Infinite Canvas Viewport -->
  <main id="canvas-viewport">
    <div id="canvas-container">
      <!-- Grouping Frames Layer (Background) -->
      <div id="frames-layer"></div>
      
      <!-- Dynamic SVG Bezier Connector Layer -->
      <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"></svg>
      
      <!-- Interactive Cards Layer (Foreground) -->
      <div id="nodes-layer"></div>
    </div>
  </main>

  <!-- Floating Controls Dock (Bottom-Left) -->
  <div class="floating-dock">
    <button id="btn-zoom-in" class="dock-btn" title="Zoom In (+)">
      <i data-lucide="plus" class="w-4 h-4"></i>
    </button>
    <button id="btn-zoom-out" class="dock-btn" title="Zoom Out (-)">
      <i data-lucide="minus" class="w-4 h-4"></i>
    </button>
    <button id="btn-zoom-reset" class="dock-btn" title="Reset View (R)">
      <i data-lucide="maximize-2" class="w-4 h-4"></i>
    </button>
    <div id="zoom-label" class="text-[11px] font-mono text-zinc-400 px-2 font-medium">95%</div>
  </div>

  <!-- Side Inspection Drawer -->
  <aside id="inspect-drawer">
    <div class="p-5 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="drawer-team" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">DEV</span>
        <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Task Details</h2>
      </div>
      <button id="drawer-close-btn" class="text-zinc-400 hover:text-white p-1 rounded-md hover:bg-white/5 transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-4">
      <div>
        <h3 id="drawer-title" class="text-base font-semibold text-white leading-snug">Task Title</h3>
        <p id="drawer-file" class="font-mono text-[11px] text-zinc-500 mt-1 truncate">workforces/tasks/example.md</p>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <div>
          <label class="text-[11px] font-medium text-zinc-400 block mb-1">Status</label>
          <select id="drawer-status" class="w-full bg-zinc-900 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-indigo-500">
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="blocked">Blocked</option>
            <option value="done">Done</option>
            <option value="dropped">Dropped</option>
          </select>
        </div>
        <div>
          <label class="text-[11px] font-medium text-zinc-400 block mb-1">Priority</label>
          <select id="drawer-priority" class="w-full bg-zinc-900 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-indigo-500 font-mono">
            <option value="P0">P0 (Urgent)</option>
            <option value="P1">P1 (High)</option>
            <option value="P2">P2 (Medium)</option>
            <option value="P3">P3 (Low)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-medium text-zinc-400 block mb-1">Description & Lineage</label>
        <div id="drawer-body" class="bg-zinc-900/60 border border-white/5 rounded-xl p-3 text-xs text-zinc-300 font-mono whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed"></div>
      </div>

      <div class="pt-2 border-t border-white/10">
        <label class="text-[11px] font-medium text-zinc-400 block mb-1">Append Evolution Note</label>
        <textarea id="drawer-note-input" rows="2" placeholder="Record blocker reason, decision change, or progress update..." class="w-full bg-zinc-900 border border-white/10 rounded-lg p-2.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors resize-none"></textarea>
      </div>
    </div>

    <div class="p-4 border-t border-white/10 bg-zinc-900/40 flex items-center justify-end gap-2">
      <button id="drawer-save-btn" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition-colors flex items-center gap-1.5 shadow-lg shadow-indigo-600/30">
        <i data-lucide="check" class="w-3.5 h-3.5"></i>
        Save Changes
      </button>
    </div>
  </aside>

  <!-- Script Engine -->
  <script src="/canvas.js"></script>
</body>
</html>
