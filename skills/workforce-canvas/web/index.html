<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce Command Canvas</title>
  <!-- Tailwind Play CDN (Zero npm dependencies) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Vector Icons (Zero emojis in UI) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked Markdown Parser (Zero npm dependencies) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/canvas.css">
</head>
<body class="bg-[#faf9f5] text-[#202020] font-sans antialiased select-none overflow-hidden">

  <!-- Top Navigation & Radar Toolbar (Floating Architectural Pill Header) -->
  <header class="fixed top-0 left-0 right-0 h-14 bg-[#faf9f5]/95 backdrop-blur-md border-b border-[#e2e0dc] z-50 px-5 flex items-center justify-between">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-[#efefef] border border-[#e2e0dc] flex items-center justify-center text-[#202020]">
        <i data-lucide="network" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight text-[#202020] leading-none">Workforce Command Canvas</h1>
        <div class="flex items-center gap-2 mt-1 text-[11px] text-[#828282] font-mono">
          <span id="stat-total-tasks">0 Tasks</span>
          <span class="text-[#d1cfca]">•</span>
          <span id="stat-in-progress" class="text-[#0369a1] font-medium">0 In Progress</span>
          <span class="text-[#d1cfca]">•</span>
          <span id="stat-blocked" class="text-[#b91c1c] font-medium">0 Blocked</span>
        </div>
      </div>
    </div>

    <!-- Mode Selector Pills -->
    <div id="mode-pills-bar" class="flex items-center bg-[#efefef] p-1 rounded-full border border-[#e2e0dc]">
      <button id="btn-mode-workstate" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#202020] text-white transition-all flex items-center gap-1.5">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
        Workstate Radar
      </button>
      <button id="btn-mode-blast" class="px-3.5 py-1.5 rounded-full text-xs font-medium text-[#4d4d4d] hover:text-[#202020] transition-all flex items-center gap-1.5">
        <i data-lucide="git-fork" class="w-3.5 h-3.5"></i>
        Code Blast Radius
      </button>
    </div>

    <!-- Perspective Navigation & Breadcrumbs (Shown in focus/constellation modes) -->
    <div id="focus-nav-bar" class="hidden items-center gap-2.5">
      <button id="btn-exit-focus" class="px-3 py-1.5 rounded-full bg-[#efefef] hover:bg-[#e5e3de] text-xs font-medium text-[#202020] border border-[#e2e0dc] flex items-center gap-1.5 transition-all">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-[#202020]"></i>
        <span id="btn-exit-focus-text">Radar (Esc)</span>
      </button>
      <div id="nav-breadcrumbs" class="flex items-center gap-1.5 text-xs text-[#828282] font-mono overflow-hidden max-w-[450px]">
        <!-- Dynamic interactive breadcrumbs -->
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="flex items-center gap-3">
      <div class="relative w-64">
        <i data-lucide="search" class="w-3.5 h-3.5 text-[#828282] absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="global-search" type="text" placeholder="Search tasks or symbols..." class="w-full bg-white border border-[#e2e0dc] rounded-full pl-9 pr-3 py-1.5 text-xs text-[#202020] placeholder-[#828282] focus:outline-none focus:border-[#c2410c] transition-colors">
      </div>
    </div>
  </header>

  <!-- Infinite Canvas Viewport -->
  <main id="canvas-viewport">
    <div id="canvas-container">
      <!-- Grouping Frames Layer (Background) -->
      <div id="frames-layer"></div>
      
      <!-- Dynamic SVG Bezier Connector Layer -->
      <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"></svg>
      
      <!-- Interactive Cards Layer (Foreground) -->
      <div id="nodes-layer"></div>
    </div>
  </main>

  <!-- Floating Controls Dock (Bottom-Left) -->
  <div class="floating-dock">
    <button id="btn-zoom-in" class="dock-btn" title="Zoom In (+)">
      <i data-lucide="plus" class="w-4 h-4"></i>
    </button>
    <button id="btn-zoom-out" class="dock-btn" title="Zoom Out (-)">
      <i data-lucide="minus" class="w-4 h-4"></i>
    </button>
    <button id="btn-zoom-reset" class="dock-btn" title="Reset View (R)">
      <i data-lucide="maximize-2" class="w-4 h-4"></i>
    </button>
    <div id="zoom-label" class="text-[11px] font-mono text-[#828282] px-2 font-medium">95%</div>
  </div>

  <!-- Side Inspection Drawer (Architectural Dossier Sheet) -->
  <aside id="inspect-drawer">
    <div class="p-5 border-b border-[#e2e0dc] flex items-center justify-between bg-[#faf9f5]">
      <div class="flex items-center gap-2">
        <span id="drawer-team" class="badge-team badge-dev">DEV</span>
        <h2 class="text-xs font-semibold text-[#828282] uppercase tracking-wider">Task Details</h2>
      </div>
      <button id="drawer-close-btn" class="text-[#828282] hover:text-[#202020] p-1 rounded hover:bg-[#efefef] transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-4">
      <div>
        <h3 id="drawer-title" class="text-base font-semibold text-[#202020] leading-snug">Task Title</h3>
        <p id="drawer-file" class="font-mono text-[11px] text-[#828282] mt-1 truncate">workforces/tasks/example.md</p>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <div>
          <label class="text-[11px] font-medium text-[#4d4d4d] block mb-1">Status</label>
          <select id="drawer-status" class="w-full bg-white border border-[#e2e0dc] rounded-none px-2.5 py-1.5 text-xs text-[#202020] focus:outline-none focus:border-[#c2410c]">
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="blocked">Blocked</option>
            <option value="done">Done</option>
            <option value="dropped">Dropped</option>
          </select>
        </div>
        <div>
          <label class="text-[11px] font-medium text-[#4d4d4d] block mb-1">Priority</label>
          <select id="drawer-priority" class="w-full bg-white border border-[#e2e0dc] rounded-none px-2.5 py-1.5 text-xs text-[#202020] focus:outline-none focus:border-[#c2410c] font-mono">
            <option value="P0">P0 (Urgent)</option>
            <option value="P1">P1 (High)</option>
            <option value="P2">P2 (Medium)</option>
            <option value="P3">P3 (Low)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-medium text-[#4d4d4d] block mb-1">Description & Lineage</label>
        <div id="drawer-body" class="markdown-body bg-[#fbfbf9] border border-[#e2e0dc] rounded-none p-3 max-h-56 overflow-y-auto leading-relaxed"></div>
      </div>

      <div class="pt-2 border-t border-[#e2e0dc]">
        <label class="text-[11px] font-medium text-[#4d4d4d] block mb-1">Append Evolution Note</label>
        <textarea id="drawer-note-input" rows="2" placeholder="Record blocker reason, decision change, or progress update..." class="w-full bg-white border border-[#e2e0dc] rounded-none p-2.5 text-xs text-[#202020] placeholder-[#828282] focus:outline-none focus:border-[#c2410c] transition-colors resize-none"></textarea>
      </div>
    </div>

    <div class="p-4 border-t border-[#e2e0dc] bg-[#faf9f5] flex items-center justify-end gap-2">
      <button id="drawer-save-btn" class="px-4 py-2 rounded-none bg-[#202020] hover:bg-[#383838] text-white font-medium text-xs transition-colors flex items-center gap-1.5 btn-sharp">
        <i data-lucide="check" class="w-3.5 h-3.5"></i>
        Save Changes
      </button>
    </div>
  </aside>

  <!-- Script Engine -->
  <script src="/canvas.js"></script>
</body>
</html>
